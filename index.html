    function getClassSubjectsDetailed(className) {
      if (!className) return DEFAULT_CLASS_SUBJECTS['5th Class'];
      const str = className.toString().trim();
      const subjectMap = (typeof state !== 'undefined' && state && state.classSubjectsMap) ? state.classSubjectsMap : DEFAULT_CLASS_SUBJECTS;
      
      const key = Object.keys(subjectMap).find(k => k.toLowerCase() === str.toLowerCase() || str.toLowerCase().includes(k.toLowerCase())) || '5th Class';
      const items = subjectMap[key] || DEFAULT_CLASS_SUBJECTS['5th Class'];
      return items.map(s => typeof s === 'string' ? { name: s, shortName: s.slice(0, 3).toUpperCase(), maxMarks: 100, passMarks: 35, type: 'Core' } : s);
    }

    function getClassSubjectsList(className) {
      return getClassSubjectsDetailed(className).map(s => s.name);
    }

    function calculateGradeAndGPA(percentage) {
      const pct = parseFloat(percentage) || 0;
      const rules = (typeof state !== 'undefined' && state && state.gradeRules) ? state.gradeRules : DEFAULT_GRADE_RULES;
      const matched = rules.find(r => pct >= r.minPct && pct <= r.maxPct) || { grade: 'F', gpa: 0, desc: 'Fail' };
      return {
        grade: matched.grade,
        gpa: matched.gpa,
        desc: matched.desc,
        isPass: matched.grade !== 'F'
      };
    }

    function isSameClass(g1, g2) {
      if (!g1 || !g2) return true;
      const s1 = g1.toString().toLowerCase();
      const s2 = g2.toString().toLowerCase();
      if (s1 === 'all' || s2 === 'all' || s1.includes('all') || s2.includes('all')) return true;
      const norm1 = s1.replace(/class/g, '').replace(/th|st|nd|rd/g, '').trim();
      const norm2 = s2.replace(/class/g, '').replace(/th|st|nd|rd/g, '').trim();
      return norm1 === norm2 || norm1.includes(norm2) || norm2.includes(norm1);
    }

      if (!sec1 || !sec2) return true;
      const s1 = sec1.toString().toLowerCase();
      const s2 = sec2.toString().toLowerCase();
      if (s1 === 'all' || s2 === 'all' || s1.includes('all') || s2.includes('all')) return true;

      const norm2 = s2.toUpperCase().replace(/SECTIONS?/g, '').replace(/SEC/g, '').trim();

    function saveFeeStructure(e) {
      e.preventDefault();
      const feeMap = { ...(state.classFeeStructure || DEFAULT_CLASS_FEE_STRUCTURE) };
      Object.keys(feeMap).forEach(clsKey => {
        const monthlyInput = document.getElementById(`feeMonthly_${clsKey}`);
        const examInput = document.getElementById(`feeExam_${clsKey}`);
        if (monthlyInput && examInput) {
          const mVal = parseFloat(monthlyInput.value) || feeMap[clsKey].monthlyFee;
          const eVal = parseFloat(examInput.value) || feeMap[clsKey].yearlyExamFee;
          const yearlyVal = (mVal * 10) + eVal + (['Nursery', 'LKG', 'UKG', '1st', '2nd', '3rd', '4th', '5th'].includes(clsKey) ? 1000 : 1800);
          feeMap[clsKey] = {
            monthlyFee: mVal,
            yearlyExamFee: eVal,
            yearlyFee: yearlyVal
          };
        }
      });

    function issueTransferCertificate(e, studentId) {
      if (e) e.preventDefault();
      const tcNo = document.getElementById('tcNoInput') ? document.getElementById('tcNoInput').value : `STV-TC-2026-${Date.now().toString().slice(-4)}`;
      const tcDate = document.getElementById('tcIssueDateInput') ? document.getElementById('tcIssueDateInput').value : '2026-08-06';
      const lastWorkDate = document.getElementById('lastWorkDateInput') ? document.getElementById('lastWorkDateInput').value : '2026-08-05';
      const reason = document.getElementById('tcReasonInput') ? document.getElementById('tcReasonInput').value : "Parent's Transfer / School Change";

      state.students = state.students.map(s => {
        if (s.id === studentId) {
          return {
            ...s,
            status: 'Transferred',
            tcNo: tcNo,
            tcIssueDate: tcDate,
            lastWorkingDate: lastWorkDate,
            tcReason: reason,
            remarks: `Transferred / TC Issued on ${tcDate} (${reason})`
          };

    function getTodayIsoDate() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getTodayFormattedDate() {
      const d = new Date();
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function calculateGrade(percentage) {
      if (percentage >= 90) return { grade: 'A+', label: 'Outstanding' };
      if (percentage >= 80) return { grade: 'A', label: 'Excellent' };
      if (percentage >= 70) return { grade: 'B', label: 'Good' };
      if (percentage >= 60) return { grade: 'C', label: 'Satisfactory' };
      return { grade: 'F', label: 'Needs Improvement' };
    }

    function calculateTermSummary(student, termName) {
      const marksObj = student.termMarks?.[termName] || {};
      let totalObtained = 0;
      let hasAnyMarkEntered = false;
      let isPass = true;

      state.subjects.forEach(sub => {
        const val = marksObj[sub] !== undefined ? parseFloat(marksObj[sub]) : 0;
        totalObtained += val;
        if (val > 0) hasAnyMarkEntered = true;
        if (val < 35) isPass = false;
      });

      const maxTotal = state.subjects.length * 100;
      const pct = maxTotal > 0 ? (totalObtained / maxTotal) * 100 : 0;
      const gradeObj = calculateGrade(pct);

      return {
        totalObtained,
        maxTotal,
        pct: pct.toFixed(1),
        grade: hasAnyMarkEntered ? gradeObj.grade : '--',
        status: hasAnyMarkEntered ? (isPass ? 'Pass' : 'Fail') : 'Pending Entry',
        hasAnyMarkEntered,
        marksObj
      };
    }

    function getStudentClassRank(student) {
      if (!student) return { rank: 1, totalInClass: 1 };
      const sameClassStudents = state.students.filter(s => s.grade === student.grade);
      const scoredStudents = sameClassStudents.map(s => {
        const summary = calculateTermSummary(s, 'Final Term Exam');
        return { id: s.id, pct: parseFloat(summary.pct) };
      });
      scoredStudents.sort((a, b) => b.pct - a.pct);
      const rankIndex = scoredStudents.findIndex(s => s.id === student.id);
      return {
        rank: rankIndex >= 0 ? rankIndex + 1 : 1,
        totalInClass: sameClassStudents.length || 1
      };
    }

    function getStudentFeeTotals(student) {
      if (!student) return { monthlyRate: 2400, examFee: 1100, admissionFee: 0, totalMonths: 10, tuitionTotal: 24000, isBus: false, monthlyBusFee: 0, annualBusFee: 0, grandTotalFee: 25100, totalPaidFee: 0, balanceDue: 25100, paidMonthsCount: 0, pendingInstallments: 10, currentMonthIndex: 3, expectedTuitionDue: 7200, actualTuitionPaid: 0, arrears: 7200 };
      
      const feeConfig = getClassFeeConfig(student.grade);
      const monthlyRate = student.monthlyFee !== undefined ? parseFloat(student.monthlyFee) : feeConfig.monthlyFee;
      const examFee = student.examFee !== undefined ? parseFloat(student.examFee) : feeConfig.yearlyExamFee;
      const totalMonths = 10; // 10 Monthly Installments (June to March)
      const tuitionTotal = monthlyRate * totalMonths;
      const admissionFee = 0; // Admission Fee removed as per user instruction

      // Transportation Details & Bus Fee
      const isBus = student.transportMode === 'School Bus';
      const monthlyBusFee = isBus ? (parseFloat(student.monthlyBusFee) || 1200) : 0;
      const annualBusFee = isBus ? (monthlyBusFee * totalMonths) : 0;

      // Grand Total Fee = Tuition (10 Months) + Yearly Exam Fee + Bus Fee
      const grandTotalFee = tuitionTotal + examFee + annualBusFee;

      // Calculate Total Paid Amount from payment history array or staff flags
      let totalPaidFee = 0;
      if (student.paymentHistory && Array.isArray(student.paymentHistory) && student.paymentHistory.length > 0) {
        student.paymentHistory.forEach(p => {
          totalPaidFee += (parseFloat(p.amount) || 0);
        });
      } else {
        const samplePaidMonths = student.paidMonths || 0;
        totalPaidFee = ((monthlyRate + monthlyBusFee) * samplePaidMonths);
        if (student.examFeePaid === true) totalPaidFee += examFee;
      }

      const balanceDue = Math.max(0, grandTotalFee - totalPaidFee);
      const totalMonthlyPackage = monthlyRate + monthlyBusFee;

      const tuitionPaid = Math.max(0, totalPaidFee - (student.examFeePaid === true ? examFee : 0));
      const paidMonthsCount = student.paidMonths !== undefined ? student.paidMonths : Math.min(totalMonths, Math.floor(tuitionPaid / (totalMonthlyPackage || 1)));

      const currentMonthIndex = 3;
      const expectedTuitionDue = currentMonthIndex * totalMonthlyPackage;
      const arrears = Math.max(0, expectedTuitionDue - tuitionPaid);

      return {
        monthlyRate,
        examFee,
        totalMonths,
        tuitionTotal,
        admissionFee: 0,
        isBus,
        monthlyBusFee,
        annualBusFee,
        grandTotalFee,
        totalPaidFee,
        balanceDue,
        paidMonthsCount,
        pendingInstallments: Math.max(0, totalMonths - paidMonthsCount),
        currentMonthIndex,
        expectedTuitionDue,
        actualTuitionPaid: tuitionPaid,
        arrears
      };
    }

    function getMonthlyInstallmentsBreakdown(student) {
      const fc = getStudentFeeTotals(student);
      const monthConfig = [
        { num: 1, name: 'June 2026 Fee', shortName: 'June' },
        { num: 2, name: 'July 2026 Fee', shortName: 'July' },
        { num: 3, name: 'August 2026 Fee', shortName: 'August' },
        { num: 4, name: 'September 2026 Fee', shortName: 'September' },
        { num: 5, name: 'October 2026 Fee', shortName: 'October' },
        { num: 6, name: 'November 2026 Fee', shortName: 'November' },
        { num: 7, name: 'December 2026 Fee', shortName: 'December' },
        { num: 8, name: 'January 2027 Fee', shortName: 'January' },
        { num: 9, name: 'February 2027 Fee', shortName: 'February' },
        { num: 10, name: 'March 2027 Fee', shortName: 'March' }
      ];

      const totalMonthlyDue = fc.monthlyRate + fc.monthlyBusFee;
      const history = student.paymentHistory || [];
      const latestTx = history[0] || {};

      let totalPool = fc.totalPaidFee;

      // 1. Allocate to Yearly Exam Fee (FIRST ROW as per user directive)
      const examDue = fc.examFee;
      const examAllocated = Math.min(examDue, totalPool);
      totalPool -= examAllocated;
      const isExamPaid = examAllocated >= examDue;

      const examRow = {
        isAdmissionRow: false,
        isExamRow: true,
        monthNumber: '★',
        monthName: `Yearly Exam Fee (${student.grade || 'Class'})`,
        shortName: 'Exam Fee',
        tuitionFee: fc.examFee,
        busFee: 0,
        totalDue: examDue,
        isPaid: isExamPaid,
        isArrear: false,
        status: isExamPaid ? 'Paid' : 'Pending',
        amountPaid: examAllocated,
        receiptNo: examAllocated > 0 ? (history.find(p => p.month && p.month.toLowerCase().includes('exam'))?.receiptNo || latestTx.receiptNo || 'REC-STV-EXAM') : '--',
        paymentDate: examAllocated > 0 ? (history.find(p => p.month && p.month.toLowerCase().includes('exam'))?.date || latestTx.date || getTodayIsoDate()) : '--',
        paymentMode: examAllocated > 0 ? (history.find(p => p.month && p.month.toLowerCase().includes('exam'))?.mode || latestTx.mode || 'UPI / Cash') : '--'
      };

      // 2. Allocate remaining pool sequentially to Monthly Installments (Rows 1 to 10)
      const monthlyRows = monthConfig.map((m, idx) => {
        const monthAllocated = Math.min(totalMonthlyDue, totalPool);
        totalPool -= monthAllocated;

        const isPaid = monthAllocated >= totalMonthlyDue;
        const isArrear = !isPaid && (idx + 1) <= fc.currentMonthIndex;

        const tx = history.find(p => p.month && p.month.toLowerCase().includes(m.shortName.toLowerCase()));

        return {
          isAdmissionRow: false,
          isExamRow: false,
          monthNumber: m.num,
          monthName: m.name,
          shortName: m.shortName,
          tuitionFee: fc.monthlyRate,
          busFee: fc.monthlyBusFee,
          totalDue: totalMonthlyDue,
          isPaid,
          isArrear,
          status: isPaid ? 'Paid' : (isArrear ? 'Arrear Pending' : 'Upcoming'),
          amountPaid: monthAllocated,
          receiptNo: monthAllocated > 0 ? (tx?.receiptNo || latestTx.receiptNo || 'REC-STV-AUTO') : '--',
          paymentDate: monthAllocated > 0 ? (tx?.date || latestTx.date || getTodayIsoDate()) : '--',
          paymentMode: monthAllocated > 0 ? (tx?.mode || latestTx.mode || 'UPI / Cash') : '--'
        };
      });

      return [examRow, ...monthlyRows];
    }

    function downloadModuleTemplate(moduleKey) {
      const schema = MODULE_SCHEMAS[moduleKey];
      if (!schema) return;
      
      if (typeof XLSX !== 'undefined') {
        const ws = XLSX.utils.json_to_sheet(schema.sample);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Import_Template");
        XLSX.writeFile(wb, schema.filename);
      } else {
        const keys = schema.columns;
        let csv = keys.join(',') + '\n';
        schema.sample.forEach(row => {
          csv += keys.map(k => `"${(row[k] !== undefined ? row[k] : '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', schema.filename.replace('.xlsx', '.csv'));
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    function triggerFileInput(moduleKey) {
      let input = document.getElementById('globalFileInput');
      if (!input) {
        input = document.createElement('input');
        input.id = 'globalFileInput';
        input.type = 'file';
        input.accept = '.xlsx, .xls, .csv';
        input.style.display = 'none';
        document.body.appendChild(input);
      }
      input.onchange = (e) => handleFileUpload(e, moduleKey);
      input.click();
    }

    function handleFileUpload(event, moduleKey) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          let rawRows = [];

          workbook.SheetNames.forEach(sheetName => {
            const sheet = workbook.Sheets[sheetName];
            const sheetData = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            sheetData.forEach(r => {
              if (!r['CLASS'] && !r['Class'] && !r['Grade'] && !r['class'] && !r['grade']) {
                r['_sheetClass'] = sheetName;
              }
            });
            rawRows = rawRows.concat(sheetData);
          });
          
          if (!rawRows || rawRows.length === 0) {
            alert('⚠️ The uploaded file is empty or could not be parsed.');
            return;
          }

          validateModuleImport(moduleKey, rawRows);
        } catch (err) {
          alert('❌ Failed to parse Excel/CSV file: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

    function getFlexValue(row, keysArray) {
      if (!row) return '';
      for (const key of keysArray) {
        if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
          return String(row[key]).trim();
        }
      }
      const rowKeys = Object.keys(row);
      for (const targetKey of keysArray) {
        const cleanTarget = targetKey.toLowerCase().replace(/[^a-z0-9]/g, '');
        const foundKey = rowKeys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanTarget);
        if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null && String(row[foundKey]).trim() !== '') {
          return String(row[foundKey]).trim();
        }
      }
      return '';
    }

    function validateModuleImport(moduleKey, rawRows) {
      const parsedRows = [];
      let validCount = 0, invalidCount = 0, duplicateCount = 0;
      const seenKeys = new Set();

      rawRows.forEach((row, idx) => {
        const rowNum = idx + 2;
        const errors = [];
        let isDuplicate = false;

        if (moduleKey === 'students') {
          const name = getFlexValue(row, ['STUDENT NAME', 'Student Name', 'StudentName', 'name', 'Name']);
          const cls = getFlexValue(row, ['CLASS', 'Class', 'Grade', 'class', 'grade', 'std', 'Class/Grade']) || row['_sheetClass'] || '1st';
          const sec = (getFlexValue(row, ['SECTION', 'Section', 'Sec', 'sec']) || 'A').toUpperCase();
          const rollNo = getFlexValue(row, ['S.NO', 'S.No', 'SNO', 'S No', 'RollNo', 'Roll No', 'rollNo', 'roll']) || (idx + 1).toString();
          const admnNo = getFlexValue(row, ['ADMN NO.', 'ADMN NO', 'Admn No.', 'AdmissionNo', 'Admission No', 'StudentID']);

          if (!name) errors.push('Student Name is required');

          const dupKey = admnNo ? `admn-${admnNo.toLowerCase()}` : `${cls.toLowerCase()}-${sec.toLowerCase()}-${rollNo}`;
          if (seenKeys.has(dupKey) || state.students.some(s => s.admnNo && admnNo && s.admnNo.toLowerCase() === admnNo.toLowerCase())) {
            isDuplicate = true;
            errors.push(`Duplicate record for Class ${cls} (${sec}) ${admnNo ? 'Admn No: ' + admnNo : 'Roll #' + rollNo}`);
          } else {
            seenKeys.add(dupKey);
          }
        } else if (moduleKey === 'marks') {
          const studentId = getFlexValue(row, ['StudentID', 'Student ID', 'studentId', 'id', 'admnNo', 'AdmissionNo', 'Admission No']);
          if (!studentId) errors.push('Student ID is required');

          ['Telugu', 'Hindi', 'English', 'Maths', 'Science', 'Social'].forEach(sub => {
            const valStr = getFlexValue(row, [sub, sub.toLowerCase()]);
            if (valStr !== '') {
              const val = parseFloat(valStr);
              if (isNaN(val) || val < 0 || val > 100) {
                errors.push(`${sub} mark must be a valid number between 0 and 100`);
              }
            }
          });
        } else if (moduleKey === 'fees') {
          const studentId = getFlexValue(row, ['StudentID', 'Student ID', 'studentId', 'id', 'admnNo', 'AdmissionNo', 'Admission No']);
          if (!studentId) errors.push('Student ID is required');
          const paidMonthsStr = getFlexValue(row, ['PaidMonthsCount', 'Paid Months', 'paidMonths', 'paidMonthsCount']);
          if (paidMonthsStr !== '') {
            const paidMonths = parseFloat(paidMonthsStr);
            if (isNaN(paidMonths) || paidMonths < 0 || paidMonths > 11) {
              errors.push('Paid Months Count must be a number between 0 and 11');
            }
          }
        } else if (moduleKey === 'attendance') {
          const studentId = getFlexValue(row, ['StudentID', 'Student ID', 'studentId', 'id', 'admnNo', 'AdmissionNo', 'Admission No']);
          const status = getFlexValue(row, ['Status', 'status']) || 'Present';
          if (!studentId) errors.push('Student ID is required');
          if (!['Present', 'Absent', 'Holiday', 'Sunday'].includes(status)) {
            errors.push('Status must be Present, Absent, Holiday, or Sunday');
          }
        } else if (moduleKey === 'faculty') {
          const teacherName = getFlexValue(row, ['TeacherName', 'Teacher Name', 'name', 'Name']);
          const subject = getFlexValue(row, ['MainSubject', 'Main Subject', 'subject', 'Subject']);
          if (!teacherName) errors.push('Teacher Name is required');
          if (!subject) errors.push('Main Subject is required');
        }

        const isValid = errors.length === 0;
        if (isValid) validCount++;
        else invalidCount++;
        if (isDuplicate) duplicateCount++;

        parsedRows.push({
          rowNum,
          rowData: row,
          isValid,
          isDuplicate,
          errors
        });
      });

      state.importPreview = {
        moduleKey,
        totalRows: rawRows.length,
        validCount,
        invalidCount,
        duplicateCount,
        rows: parsedRows
      };

      state.activeModal = 'importPreview';
      render();
    }

    function getStudentAttendanceStats(student, yearConfig = ACADEMIC_YEAR_CONFIG) {
      if (!student) return { academicYear: '2026–2027', totalWorkingDays: 0, totalPresent: 0, totalAbsent: 0, attendancePct: '0.0', totalRemainingDays: 0, totalHolidays: 0, totalSundays: 0 };
      
      const history = student.attendanceHistory || {};
      const start = new Date(yearConfig.startDate);
      const end = new Date(yearConfig.endDate);
      const today = new Date();

      let totalWorkingDays = 0;
      let totalPresent = 0;
      let totalAbsent = 0;
      let totalHolidays = 0;
      let totalSundays = 0;
      let totalRemainingDays = 0;

      const holidayDateSet = new Set(yearConfig.holidays.map(h => h.date));

      let curr = new Date(start);
      while (curr <= end) {
        const isoDate = curr.toISOString().split('T')[0];
        const isSunday = curr.getDay() === 0;
        const isHoliday = holidayDateSet.has(isoDate);

        if (curr <= today) {
          if (isSunday) {
            totalSundays++;
          } else if (isHoliday) {
            totalHolidays++;
          } else {
            totalWorkingDays++;
            const record = history[isoDate];
            if (record && record.status === 'Absent') {
              totalAbsent++;
            } else if (record && record.status === 'Present') {
              totalPresent++;
            } else if (student.isNewStudent || student.hasCustomAttendance === false) {
              // Newly enrolled student starts with 0 present / 0 absent until attendance is recorded
            } else {
              // Seeded demo student default present count
              totalPresent++;
            }
          }
        } else {
          if (!isSunday && !isHoliday) {
            totalRemainingDays++;
          }
        }
        curr.setDate(curr.getDate() + 1);
      }

      const attendancePct = (totalPresent + totalAbsent) > 0
        ? ((totalPresent / (totalPresent + totalAbsent)) * 100).toFixed(1)
        : (student.isNewStudent ? '0.0' : (totalWorkingDays > 0 ? ((totalPresent / totalWorkingDays) * 100).toFixed(1) : '100.0'));

      return {
        academicYear: yearConfig.yearName,
        startDate: yearConfig.startDate,
        endDate: yearConfig.endDate,
        todayDate: getTodayFormattedDate(),
        totalWorkingDays,
        totalPresent,
        totalAbsent,
        attendancePct,
        totalRemainingDays,
        totalHolidays,
        totalSundays
      };
    }

    function getAbsenceRecordsForStudent(student, yearConfig = ACADEMIC_YEAR_CONFIG) {
      if (!student) return [];
      const history = student.attendanceHistory || {};
      const holidayDateSet = new Set(yearConfig.holidays.map(h => h.date));
      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const records = [];
      const start = new Date(yearConfig.startDate);
      const today = new Date();

      let curr = new Date(start);
      while (curr <= today) {
        const isoDate = curr.toISOString().split('T')[0];
        const isSunday = curr.getDay() === 0;
        const isHoliday = holidayDateSet.has(isoDate);

        if (!isSunday && !isHoliday) {
          const rec = history[isoDate];
          if (rec && rec.status === 'Absent') {
            const dObj = new Date(curr);
            records.push({
              isoDate,
              formattedDate: `${dObj.getDate() < 10 ? '0' + dObj.getDate() : dObj.getDate()}-${monthNames[dObj.getMonth()].slice(0, 3)}-${dObj.getFullYear()}`,
              dayName: dayNames[dObj.getDay()],
              monthName: `${monthNames[dObj.getMonth()]} ${dObj.getFullYear()}`,
              reason: rec.reason || 'Fever / Sick Leave',
              leaveApproved: rec.leaveApproved !== undefined ? rec.leaveApproved : true
            });
          }
        }
        curr.setDate(curr.getDate() + 1);
      }

      return records;
    }

    function renderMonthlyCalendar(student, year, monthIndex) {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const monthName = monthNames[monthIndex];
      const firstDay = new Date(year, monthIndex, 1);
      const startingDayOfWeek = firstDay.getDay();
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

      const history = student ? (student.attendanceHistory || {}) : {};
      const holidayDateSet = new Set(ACADEMIC_YEAR_CONFIG.holidays.map(h => h.date));
      const todayIso = getTodayIsoDate();

      let cellsHtml = '';

      for (let i = 0; i < startingDayOfWeek; i++) {
        cellsHtml += `<div class="h-14 bg-slate-50/50 border border-slate-200/60 rounded-xl"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dayStr = d < 10 ? `0${d}` : `${d}`;
        const mStr = (monthIndex + 1) < 10 ? `0${monthIndex + 1}` : `${monthIndex + 1}`;
        const isoDate = `${year}-${mStr}-${dayStr}`;
        
        const dateObj = new Date(year, monthIndex, d);
        const isSunday = dateObj.getDay() === 0;
        const isHoliday = holidayDateSet.has(isoDate);
        const holidayObj = ACADEMIC_YEAR_CONFIG.holidays.find(h => h.date === isoDate);

        const record = history[isoDate];
        const isPastOrToday = isoDate <= todayIso;

        let cellClass = 'bg-white text-slate-800 border-slate-200 hover:border-indigo-400';
        let badgeText = '';

        if (isSunday) {
          cellClass = 'bg-slate-300 text-slate-700 font-bold border-slate-400';
          badgeText = 'Sunday';
        } else if (isHoliday) {
          cellClass = 'bg-amber-400 text-slate-900 font-bold border-amber-500';
          badgeText = holidayObj ? holidayObj.name : 'Holiday';
        } else if (isPastOrToday) {
          if (record && record.status === 'Absent') {
            cellClass = 'bg-rose-600 text-white font-bold border-rose-700 shadow-xs';
            badgeText = '🔴 Absent';
          } else {
            cellClass = 'bg-emerald-500 text-white font-bold border-emerald-600 shadow-xs';
            badgeText = '🟢 Present';
          }
        } else {
          cellClass = 'bg-slate-50 text-slate-400 border-slate-200';
          badgeText = 'School Day';
        }

        cellsHtml += `
          <div onclick="openDateAttendanceModal('${student.id}', '${isoDate}')" class="h-14 p-1.5 border rounded-xl flex flex-col justify-between cursor-pointer transition-all hover:scale-105 ${cellClass}">
            <div class="flex justify-between items-center text-xs font-black">
              <span>${d}</span>
              ${isoDate === todayIso ? '<span class="bg-white text-slate-900 text-[9px] px-1 rounded font-bold">TODAY</span>' : ''}
            </div>
            <div class="text-[9px] font-bold truncate">${badgeText}</div>
          </div>
        `;
      }

      return `
        <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 shadow-sm">
          <div class="flex flex-wrap justify-between items-center border-b pb-3 gap-2">
            <h4 class="text-lg font-black text-slate-900 font-display">Monthly Attendance Calendar: ${monthName} ${year}</h4>

    function renderDigitGrid(valueStr = '', totalDigits = 12) {
      const digits = (valueStr || '').replace(/\D/g, '').split('');
      let html = '<div class="inline-flex items-center space-x-1.5 font-mono font-bold text-xs">';
      
      if (totalDigits === 12) {
        for (let group = 0; group < 3; group++) {
          html += '<div class="flex border border-slate-700 bg-white rounded overflow-hidden shadow-2xs">';
          for (let i = 0; i < 4; i++) {
            const idx = group * 4 + i;
            const d = digits[idx] || '';
            html += `<span class="w-4 h-5 flex items-center justify-center border-r border-slate-300 last:border-r-0 text-slate-900 font-bold text-[11px]">${d}</span>`;
          }
          html += '</div>';
        }
      } else if (totalDigits === 10) {
        html += '<div class="flex border border-slate-700 bg-white rounded overflow-hidden shadow-2xs">';
        for (let i = 0; i < 10; i++) {
          const d = digits[i] || '';
          html += `<span class="w-4 h-5 flex items-center justify-center border-r border-slate-300 last:border-r-0 text-slate-900 font-bold text-[10px]">${d}</span>`;
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function getFilteredStudents() {
      return state.students.filter(s => {
        const matchGrade = state.selectedGrade === 'all' || s.grade.toString().toLowerCase() === state.selectedGrade.toString().toLowerCase();
        const matchSec = state.selectedSection === 'all' || s.section.toUpperCase() === state.selectedSection.toUpperCase();
        
        let matchStatus = true;
        const isTransferred = (s.status === 'Transferred' || s.status === 'TC Issued');
        const isAlumni = (s.status === 'Alumni' || s.grade.includes('10th (Passout)'));

        if (state.selectedStatusFilter === 'active') {
          matchStatus = !isTransferred && !isAlumni;
        } else if (state.selectedStatusFilter === 'transferred') {
          matchStatus = isTransferred;
        } else if (state.selectedStatusFilter === 'alumni') {
          matchStatus = isAlumni;
        }

        const search = state.searchTerm.toLowerCase().trim();
        const matchSearch = !search ||
          s.name.toLowerCase().includes(search) ||
          s.rollNo.toString().toLowerCase().includes(search) ||
          (s.admnNo && s.admnNo.toLowerCase().includes(search)) ||
          s.parentName.toLowerCase().includes(search) ||
          s.phone.includes(search) ||
          s.grade.toLowerCase().includes(search);

        return matchGrade && matchSec && matchStatus && matchSearch;
      });
    }

    function insertMessageTag(tag) {

        textarea.value = text.substring(0, start) + tag + text.substring(end);

    function executeMassBroadcastModal(e) {
      if (e) e.preventDefault();
      const audienceSelect = document.getElementById('broadcastAudienceSelect');
      const categorySelect = document.getElementById('broadcastCategorySelect');
      const msgTextarea = document.getElementById('broadcastMessageText');
      const photoInput = document.getElementById('broadcastPhotoInput');

      const targetAudience = audienceSelect ? audienceSelect.value : (state.broadcastAudience || 'all');
      const category = categorySelect ? categorySelect.value : (state.broadcastCategory || 'absence');
      const msgText = msgTextarea ? msgTextarea.value.trim() : (state.broadcastMessageText || '');
      const photoUrl = photoInput ? photoInput.value.trim() : (state.broadcastAttachedPhoto || '');

      const activeStudents = state.students.filter(s => s.status !== 'Alumni' && s.status !== 'Transferred');
      const todayIso = getTodayIsoDate();

      let recipientList = [];
      if (targetAudience === 'absentees_today') {
        recipientList = activeStudents.filter(s => {
          const h = s.attendanceHistory || {};
          const todayRec = h[todayIso];
          return (todayRec && todayRec.status === 'Absent') || state.attendanceMap[s.id] === 'Absent';
        });
      } else if (targetAudience === 'fee_defaulters') {
        recipientList = activeStudents.filter(s => getStudentFeeTotals(s).balanceDue > 0);
      } else if (targetAudience.startsWith('grade_')) {
        const cls = targetAudience.replace('grade_', '');
        recipientList = activeStudents.filter(s => s.grade.toLowerCase().includes(cls.toLowerCase()));
      } else {
        recipientList = activeStudents;
      }

      if (recipientList.length === 0) {
        alert('⚠️ No parent records found matching your target audience filter.');
        return;
      }

      const categoryNameMap = {
        absence: 'Daily Absence Notice',
        fee: 'Fee Arrear Payment Reminder',
        event_photo: 'School Program & Achievement Photo Dispatch',
        custom: 'Custom School Circular / Notice'
      };

      const newLog = {
        id: `BC-2026-${Date.now().toString().slice(-4)}`,
        timestamp: new Date().toISOString().replace('T', ' ').slice(0, 16),
        sender: `${state.currentUser ? (state.currentUser.fullName || state.currentUser.username) : 'Admin'} (${ROLES_CONFIG[state.currentUser?.role]?.name || 'Admin'})`,
        type: categoryNameMap[category] || 'General Notice',
        targetAudience: targetAudience.toUpperCase().replace('_', ' '),
        recipientCount: recipientList.length,
        message: msgText,
        photoUrl: photoUrl,
        status: `🟢 Delivered (${recipientList.length}/${recipientList.length} Success)`
      };

      if (!state.broadcastLogs) state.broadcastLogs = [];
      state.broadcastLogs.unshift(newLog);

      state.modalBroadcastData = newLog;
      state.activeModal = 'broadcastProgress';
      saveState();
    }

    function handleLogin(e) {
      if (e) e.preventDefault();
      const uInp = document.getElementById('loginUsername');
      const pInp = document.getElementById('loginPassword');
      const rInp = document.getElementById('loginRole');
      
      const u = uInp ? uInp.value.trim().toLowerCase() : '';
      const p = pInp ? pInp.value.trim() : '';
      const selectedRole = rInp ? rInp.value : '';

      const matchedUser = state.users.find(usr => usr.username.toLowerCase() === u);

      if (!matchedUser) {
        state.loginError = '⚠️ Access Denied! Username does not exist or this user account has been REMOVED by the Correspondent (Super Admin).';
        saveState();
        return;
      }

      if (matchedUser.status === 'Disabled' || matchedUser.status === 'Inactive') {
        state.loginError = `⚠️ Access Denied! User account "${matchedUser.fullName}" (${ROLES_CONFIG[matchedUser.role]?.name || matchedUser.role}) has been DISABLED by the Correspondent (Super Admin). Login is blocked.`;
        saveState();
        return;
      }

      if (matchedUser.passwordHash !== p) {
        state.loginError = '⚠️ Incorrect Password! Please check your password or contact the Correspondent (Super Admin).';
        saveState();
        return;
      }

      if (selectedRole && matchedUser.role !== selectedRole) {
        state.loginError = `⚠️ Role Selection Mismatch! User "${matchedUser.username}" is registered as "${ROLES_CONFIG[matchedUser.role]?.name || matchedUser.role}".`;
        saveState();
        return;
      }

      matchedUser.lastLogin = new Date().toISOString().replace('T', ' ').slice(0, 16);
      state.currentUser = matchedUser;
      state.loginError = '';
      state.viewMode = 'portal';
      
      const roleConfig = ROLES_CONFIG[matchedUser.role] || ROLES_CONFIG['admin'];
      state.activeTab = roleConfig.allowedTabs[0] || 'dashboard';
      state.activeModal = null;
      saveState();
    }

    // YEAR-END READINESS CHECKLIST & OVERRIDE HANDLERS
    function getYearEndReadinessData() {
      const activeStudents = state.students.filter(s => s.status !== 'Alumni' && s.status !== 'Transferred');
      const pendingFeeStudents = activeStudents.filter(s => getStudentFeeTotals(s).balanceDue > 0);
      const totalPendingFeeAmount = pendingFeeStudents.reduce((sum, s) => sum + getStudentFeeTotals(s).balanceDue, 0);

      // Fee Status (3-State)
      let feeStatus = 'Completed';
      if (pendingFeeStudents.length === 0) {
        feeStatus = 'Completed';
      } else if (pendingFeeStudents.length < activeStudents.length) {
        feeStatus = 'Work In Progress';
      } else {
        feeStatus = 'Not Completed';
      }

      // Exam Marks Status (3-State)
      const studentsMissingFinalMarks = activeStudents.filter(s => !s.termMarks?.['Final Term Exam'] || Object.keys(s.termMarks['Final Term Exam']).length === 0);
      let marksStatus = 'Completed';
      if (studentsMissingFinalMarks.length === 0) {
        marksStatus = 'Completed';
      } else if (studentsMissingFinalMarks.length < activeStudents.length) {
        marksStatus = 'Work In Progress';
      } else {
        marksStatus = 'Not Completed';
      }

      // Attendance Status (3-State)
      const attendanceRecordedCount = Object.keys(state.attendanceMap).length;
      let attendanceStatus = attendanceRecordedCount > 0 ? 'Completed' : 'Work In Progress';

      // Pending Approvals (3-State)
      const pendingReviewsCount = state.website.reviews.filter(r => r.status === 'Pending').length;
      let approvalsStatus = pendingReviewsCount === 0 ? 'Completed' : 'Work In Progress';

      const items = [
        {
          id: 'fees',
          title: 'All Student Fee Collections Completed',
          desc: `Verify that active students have zero pending fee arrears. Note: If Super Admin overrides pending fees, unpaid balances (₹${totalPendingFeeAmount.toLocaleString()} across ${pendingFeeStudents.length} students) will automatically carry forward as 'Previous Year Overdue Fee' into the 2027–2028 Fee Ledgers.`,
          status: feeStatus,
          pendingStudents: pendingFeeStudents,
          totalPendingAmount: totalPendingFeeAmount,
          details: pendingFeeStudents.length > 0 ? `${pendingFeeStudents.length} students with fee arrears` : 'All fees collected in full'
        },
        {
          id: 'exam_marks',

        try { window.stvWaWindow.focus(); } catch(e) {}
      } else {
        const leftPos = Math.max(0, window.screen.width - 880);
        window.stvWaWindow = window.open(
          waUrl,
          'STV_WHATSAPP_POPUP_WIN',
          `width=850,height=750,left=${leftPos},top=50,resizable=yes,scrollbars=yes`
        );
        if (window.stvWaWindow) {

        }
      }
    }

    function handleSpreadsheetCellInput(studentId, subjectClean, maxMarksNum) {
      const inputEl = document.getElementById(`mark_input_${studentId}_${subjectClean}`);
      if (!inputEl) return;

      let val = inputEl.value.trim().toUpperCase();
      const maxM = parseFloat(maxMarksNum) || 100;

      if (val !== '' && val !== 'AB' && val !== 'ML' && val !== 'NA') {
        const num = parseFloat(val);
        if (isNaN(num)) {
          inputEl.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
        } else if (num < 0) {
          // Negative marks blocked
          inputEl.value = '0';
          inputEl.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
          showToast('🚫 Negative marks are blocked! Auto-corrected to 0.');
        } else if (num > maxM) {
          // Exceeding max marks blocked
          inputEl.value = maxM.toString();
          inputEl.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
          showToast(`🚫 Marks cannot exceed Max Limit (${maxM})! Auto-corrected to ${maxM}.`);
        } else {
          inputEl.classList.remove('bg-rose-100', 'border-rose-500', 'text-rose-900');
        }
      } else {
        inputEl.classList.remove('bg-rose-100', 'border-rose-500', 'text-rose-900');
      }

      const student = state.students.find(s => s.id === studentId);
      if (!student) return;

      const currentClass = student.grade;
      const subjectsList = getClassSubjectsList(currentClass);
      const examConfig = (state.examsList || DEFAULT_EXAMS).find(e => e.code === (state.selectedExamFilter || 'FA1')) || { maxMarks: 100 };
      const maxSubjectMarks = examConfig.maxMarks || 100;
      const maxTotal = subjectsList.length * maxSubjectMarks;

      let obtainedSum = 0;
      subjectsList.forEach(sub => {
        const inp = document.getElementById(`mark_input_${studentId}_${sub.replace(/\s+/g, '_')}`);
        const v = inp ? inp.value.trim().toUpperCase() : '';
        if (v !== '' && v !== 'AB' && v !== 'ML' && v !== 'NA') {
          const n = parseFloat(v);
          if (!isNaN(n) && n >= 0 && n <= maxSubjectMarks) {
            obtainedSum += n;
          }
        }
      });

      const pct = maxTotal > 0 ? ((obtainedSum / maxTotal) * 100).toFixed(1) : '0.0';
      const gradeInfo = calculateGradeAndGPA(pct);

      const totalEl = document.getElementById(`total_${studentId}`);
      if (totalEl) totalEl.innerText = `${obtainedSum} / ${maxTotal}`;

      const pctEl = document.getElementById(`pct_${studentId}`);
      if (pctEl) pctEl.innerText = `${pct}%`;

      const gradeEl = document.getElementById(`grade_${studentId}`);
      if (gradeEl) {
        gradeEl.innerHTML = `<span class="px-2 py-0.5 rounded text-[11px] ${gradeInfo.grade === 'F' ? 'bg-rose-100 text-rose-800 border border-rose-300' : 'bg-emerald-100 text-emerald-900 border border-emerald-300'}">${gradeInfo.grade}</span>`;
      }

      const gpaEl = document.getElementById(`gpa_${studentId}`);
      if (gpaEl) gpaEl.innerText = `${gradeInfo.gpa}`;

      const resultEl = document.getElementById(`result_${studentId}`);
      if (resultEl) {
        resultEl.innerHTML = `<span class="px-2.5 py-0.5 rounded-full text-[10px] ${gradeInfo.isPass ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-rose-100 text-rose-900 border border-rose-300'}">${gradeInfo.isPass ? '🟢 Pass' : '🔴 Fail'}</span>`;
      }
    }

    function saveClassExamMarks(grade, section, examCode) {
      const examKey = `${state.activeAcademicYear}_${examCode}_${grade}_${section}`;
      const examStatus = state.examStatuses[examKey] || 'Open';
      const isLocked = examStatus === 'Locked' || examStatus === 'Published';
      const canEdit = !isLocked || state.currentUser.role === 'super_admin' || state.currentUser.role === 'principal';

      if (!canEdit) {
        alert('🚫 Exam Locked!\n\nThis exam is published & locked. Only Correspondent (Super Admin) or Principal can edit locked exam marks.');
        return;
      }

      // Collect all student mark input rows directly from the visible spreadsheet DOM table
      const rows = document.querySelectorAll('#marks-spreadsheet-body tr[id^="row_student_"]');
      let updatedCount = 0;

      if (rows && rows.length > 0) {
        rows.forEach(row => {
          const studentId = row.id.replace('row_student_', '');
          const studentObj = state.students.find(s => s.id === studentId);
          if (studentObj) {
            const newExamMarks = { ...(studentObj.termMarks?.[examCode] || {}) };
            const subjectsDetailed = getClassSubjectsDetailed(studentObj.grade);

            subjectsDetailed.forEach(subObj => {
              const subName = subObj.name;
              const inp = document.getElementById(`mark_input_${studentId}_${subName.replace(/\s+/g, '_')}`);
              if (inp) {
                const val = inp.value.trim().toUpperCase();
                newExamMarks[subName] = val;
              }
            });

            const remarkInp = document.getElementById(`remark_input_${studentId}_${examCode}`);
            if (remarkInp) {
              const rVal = remarkInp.value.trim();
              newExamMarks['teacherRemarks'] = rVal;
              studentObj.teacherRemarks = rVal;
            }

            studentObj.termMarks = {
              ...(studentObj.termMarks || {}),
              [examCode]: newExamMarks
            };

            if (isLocked) {
              state.marksAuditLogs.unshift({
                id: `LOG-${Date.now()}`,
                studentId: studentObj.id,
                studentName: studentObj.name,
                exam: examCode,
                user: state.currentUser.fullName || state.currentUser.username,
                timestamp: new Date().toLocaleString(),
                reason: 'Super Admin / Principal Override on Locked Exam'
              });
            }

            updatedCount++;
          }
        });
      } else {
        // Fallback for non-DOM save call
        state.students = state.students.map(s => {
          if (isSameClass(s.grade, grade) && isSameSection(s.section, section) && s.status !== 'Transferred') {
            const subjectsList = getClassSubjectsList(s.grade);
            const newExamMarks = { ...(s.termMarks?.[examCode] || {}) };
            subjectsList.forEach(sub => {
              const inp = document.getElementById(`mark_input_${s.id}_${sub.replace(/\s+/g, '_')}`);
              if (inp) {
                const val = inp.value.trim().toUpperCase();
                newExamMarks[sub] = val;
              }
            });

            const remarkInp = document.getElementById(`remark_input_${s.id}_${examCode}`);
            if (remarkInp) {
              const rVal = remarkInp.value.trim();
              newExamMarks['teacherRemarks'] = rVal;
              s.teacherRemarks = rVal;
            }

            updatedCount++;
            return {
              ...s,
              termMarks: {
                ...(s.termMarks || {}),
                [examCode]: newExamMarks
              }
            };
          }
          return s;
        });
      }

      if (updatedCount === 0) {
        alert('No active student rows found in table to save marks for!');
        return;
      }

      saveState();
      alert(`✅ Marks Saved Successfully!\n\nSuccessfully saved ${examCode} examination marks for ${updatedCount} students.`);
    }

    function saveFeePayment(e) {
      e.preventDefault();
      if (!state.modalStudent) return;

      const fc = getStudentFeeTotals(state.modalStudent);
      const month = document.getElementById('feeMonthInput').value;
      const mode = document.getElementById('feeModeInput').value;
      const amountInput = document.getElementById('feeAmountInput');
      const dateInput = document.getElementById('feeDateInput');

      const amount = parseFloat(amountInput ? amountInput.value : 0);
      const paymentDate = dateInput ? dateInput.value : getTodayIsoDate();
      const todayIso = getTodayIsoDate();

      // VALIDATION 1: NO NEGATIVE OR ZERO AMOUNT
      if (isNaN(amount) || amount <= 0) {
        alert('🚫 Invalid Payment Amount!\n\nFee payment amount must be greater than ₹0. Negative or zero amounts are strictly blocked.');
        if (amountInput) amountInput.focus();
        return;
      }

      // VALIDATION 2: CANNOT EXCEED REMAINING BALANCE DUE / GRAND PACKAGE
      if (amount > fc.balanceDue) {
        alert(`🚫 Excess Payment Amount Blocked!\n\nPayment amount (₹${amount.toLocaleString()}) exceeds the student's remaining balance due of ₹${fc.balanceDue.toLocaleString()}.\nPayment cannot exceed the total annual fee package.`);
        if (amountInput) amountInput.focus();
        return;
      }

      // VALIDATION 3: PRESENT DATE OR PAST DATE ONLY (NO FUTURE DATES)
      if (paymentDate > todayIso) {
        alert(`🚫 Future Payment Date Blocked!\n\nSelected payment date (${paymentDate}) is in the future. Please select today's date (${todayIso}) or a past date.`);
        if (dateInput) dateInput.focus();
        return;
      }

      const receiptNo = `REC-STV-${Date.now().toString().slice(-5)}`;

      let updatedTargetStudent = null;

      state.students = state.students.map(s => {
        if (s.id === state.modalStudent.id) {
          const currentHistory = s.paymentHistory || [];
          const newTx = { receiptNo, date: paymentDate, month, amount, mode };
          const updatedHistory = [newTx, ...currentHistory];

          // Compute new totals after payment
          let newTotalPaid = 0;
          updatedHistory.forEach(p => { newTotalPaid += (parseFloat(p.amount) || 0); });

          const monthlyRate = s.monthlyFee || getMonthlyFeeByClass(s.grade);
          const admissionFee = s.admissionFee || 5000;
          const actualTuitionPaid = s.admissionFeePaid ? Math.max(0, newTotalPaid - admissionFee) : newTotalPaid;
          const newPaidMonths = Math.min(11, Math.floor(actualTuitionPaid / monthlyRate));

          updatedTargetStudent = {
            ...s,
            paidMonths: newPaidMonths,
            paymentHistory: updatedHistory
          };
          return updatedTargetStudent;
        }
        return s;
      });

      if (updatedTargetStudent) {
        state.modalStudent = updatedTargetStudent;
        state.modalTransaction = updatedTargetStudent.paymentHistory[0];
        state.activeModal = 'printFeeReceipt';
        saveState();
        setTimeout(() => {
          window.print();
        }, 300);
      } else {
        closeModal();
      }
    }

        parentRelation: 'Father',
        phone: document.getElementById('newPhone').value,
        whatsappNo: document.getElementById('newWhatsappNo') ? document.getElementById('newWhatsappNo').value : document.getElementById('newPhone').value,
        altPhone: document.getElementById('newWhatsappNo') ? document.getElementById('newWhatsappNo').value : document.getElementById('newPhone').value,
        address: document.getElementById('newAddress').value,
        photoUrl: state.tempPhotoPreview || DEFAULT_AVATAR,
        
        motherName: document.getElementById('newMotherName') ? document.getElementById('newMotherName').value : 'Fatima Begum',
        motherProfession: document.getElementById('newMotherProf') ? document.getElementById('newMotherProf').value : 'Homemaker',
        motherAadhaar: document.getElementById('newMotherAadhaar') ? document.getElementById('newMotherAadhaar').value : '8821 4451 9012',
        motherOfficeAddress: document.getElementById('newMotherOffAddr') ? document.getElementById('newMotherOffAddr').value : 'Chilkanagar, Uppal',
        
        fatherName: fatherNameVal,
        fatherProfession: document.getElementById('newFatherProf') ? document.getElementById('newFatherProf').value : 'Business',
        fatherAadhaar: document.getElementById('newFatherAadhaar') ? document.getElementById('newFatherAadhaar').value : '4410 7782 1198',
        fatherOfficeAddress: document.getElementById('newFatherOffAddr') ? document.getElementById('newFatherOffAddr').value : 'Main Road, Uppal',
        
        identMark1: document.getElementById('newIdentMark1') ? document.getElementById('newIdentMark1').value : 'A mole on the right cheek',
        identMark2: document.getElementById('newIdentMark2') ? document.getElementById('newIdentMark2').value : 'A scar on the left wrist',
        
        sibling1Name: document.getElementById('newSib1Name') ? document.getElementById('newSib1Name').value : '',
        sibling1Class: document.getElementById('newSib1Class') ? document.getElementById('newSib1Class').value : '',
        sibling1Sec: document.getElementById('newSib1Sec') ? document.getElementById('newSib1Sec').value : '',
        sibling2Name: document.getElementById('newSib2Name') ? document.getElementById('newSib2Name').value : '',
        sibling2Class: document.getElementById('newSib2Class') ? document.getElementById('newSib2Class').value : '',
        sibling2Sec: document.getElementById('newSib2Sec') ? document.getElementById('newSib2Sec').value : '',

        transportMode: document.getElementById('newTransportMode') ? document.getElementById('newTransportMode').value : 'Own Transportation',
        busRoute: document.getElementById('newBusRoute') ? document.getElementById('newBusRoute').value.split('|')[0] : 'Route 2 - Uppal Depot / Junction',
        pickupPoint: document.getElementById('newPickupPoint') ? document.getElementById('newPickupPoint').value : 'Uppal X Roads',
        monthlyBusFee: document.getElementById('newTransportMode') && document.getElementById('newTransportMode').value === 'School Bus' ? (parseFloat(document.getElementById('newMonthlyBusFee').value) || 1200) : 0,

        admissionFee: 5000,
        examFee: 2000,
        monthlyFee: getMonthlyFeeByClass(grade),
        totalMonths: 10,
        paidMonths: 0,
        isNewStudent: true,
        attendanceHistory: {},
        admissionFeePaid: true,
        examFeePaid: true,
        termMarks: {
          '1st Term Exam': term1Marks,
          '2nd Term Exam': term2Marks,
          'Final Term Exam': term3Marks
        },
        paymentHistory: []
      };

      state.students.unshift(newStudent);
      state.activeModal = 'printAdmission';
      state.modalStudent = newStudent;
      saveState();
    }

    function addSubject(e) {
      e.preventDefault();
      const val = document.getElementById('newSubjInput').value.trim();
      if (val && !state.subjects.includes(val)) {
        state.subjects.push(val);
      }
      saveState();
    }

    function removeSubject(sub) {
      if (confirm(`Remove subject ${sub}?`)) {
        state.subjects = state.subjects.filter(s => s !== sub);
        saveState();
      }
    }

    function setAttendance(id, st) {
      state.attendanceMap[id] = st;
      saveState();
    }

    function addTask(e) {
      e.preventDefault();
      const val = document.getElementById('newTaskInput').value.trim();
      if (val) { state.tasks.unshift({ id: Date.now(), title: val, completed: false }); }
      saveState();
    }

    function toggleTask(id) {
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveState();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
    }

    function addNote(e) {
      e.preventDefault();
      const val = document.getElementById('newNoteInput').value.trim();
      if (val) { state.notes.unshift({ id: Date.now(), text: val, date: '02-Aug-2026' }); }
      saveState();
    }

    function deleteNote(id) {
      state.notes = state.notes.filter(n => n.id !== id);
      saveState();
    }

    function exportToExcel() {
      const currentTab = state.activeTab;
      const filtered = getFilteredStudents();
      const isAdmin = state.currentUser?.role === 'admin';
      const wb = XLSX.utils.book_new();

      if (currentTab === 'fees' && isAdmin) {
        // EXPORT COMPLETE FEE DETAILS LEDGER
        const feeData = filtered.map((s, idx) => {
          const feeCalc = getStudentFeeTotals(s);
          return {
            'S.No': idx + 1,
            'Student ID': s.id,
            'Roll No': s.rollNo,
            'Student Name': s.name,
            'Class': s.grade,
            'Section': s.section,
            'Parent Name': s.parentName,
            'Primary Phone': s.phone,
            'Alternate Phone': s.altPhone || 'N/A',
            'Monthly Fee Rate (₹)': feeCalc.monthlyRate,
            '10-Month Tuition Fee (₹)': feeCalc.monthlyRate * 10,
            'Admission Fee (₹)': s.admissionFee || 5000,
            'Exam Fee (₹)': s.examFee || 2000,
            'Grand Total Annual Fee (₹)': feeCalc.grandTotalFee,
            'Paid Months (out of 10)': `${s.paidMonths}/10`,
            'Total Amount Paid (₹)': feeCalc.totalPaidFee,
            'Pending Balance Due (₹)': feeCalc.balanceDue,
            'Fee Status': feeCalc.balanceDue <= 0 ? 'Full Paid' : (feeCalc.totalPaidFee > 0 ? 'Partial Paid' : 'Unpaid')
          };
        });
        const ws = XLSX.utils.json_to_sheet(feeData);
        XLSX.utils.book_append_sheet(wb, ws, 'Fee_Details_Ledger');
        XLSX.writeFile(wb, `ST_VENUS_HIGH_SCHOOL_Fee_Details_${Date.now().toString().slice(-4)}.xlsx`);
      } else if (currentTab === 'performance') {
        // EXPORT COMPLETE ACADEMIC MARKS & MULTI-TERM PERFORMANCE
        const marksData = filtered.map((s, idx) => {
          const s1 = calculateTermSummary(s, '1st Term Exam');
          const s2 = calculateTermSummary(s, '2nd Term Exam');
          const s3 = calculateTermSummary(s, 'Final Term Exam');
          const rankInfo = getStudentClassRank(s);

          const row = {
            'S.No': idx + 1,
            'Student ID': s.id,
            'Roll No': s.rollNo,
            'Student Name': s.name,
            'Class': s.grade,
            'Section': s.section,
            'Class Rank': `#${rankInfo.rank} of ${rankInfo.totalInClass}`,
            '1st Term Score': `${s1.totalObtained}/${s1.maxTotal}`,
            '1st Term Pct': `${s1.pct}%`,
            '1st Term Grade': s1.grade,
            '1st Term Status': s1.status,
            '2nd Term Score': `${s2.totalObtained}/${s2.maxTotal}`,
            '2nd Term Pct': `${s2.pct}%`,
            '2nd Term Grade': s2.grade,
            '2nd Term Status': s2.status,
            'Final Term Score': `${s3.totalObtained}/${s3.maxTotal}`,
            'Final Term Pct': `${s3.pct}%`,
            'Final Term Grade': s3.grade,
            'Final Term Status': s3.status
          };

          state.subjects.forEach(sub => {
            row[`Final Marks (${sub})`] = s.termMarks?.['Final Term Exam']?.[sub] ?? 0;
          });

          return row;
        });
        const ws = XLSX.utils.json_to_sheet(marksData);
        XLSX.utils.book_append_sheet(wb, ws, 'Academic_Performance');
        XLSX.writeFile(wb, `ST_VENUS_HIGH_SCHOOL_Academic_Marks_${Date.now().toString().slice(-4)}.xlsx`);
      } else if (currentTab === 'faculty') {
        // EXPORT COMPLETE FACULTY ROSTER & WORKLOADS
        const facultyData = state.teachers.map((t, idx) => ({
          'S.No': idx + 1,
          'Teacher Code': t.teacherCode || t.id,
          'Teacher Name': t.name,
          'Qualification': t.qualification,
          'Subject Allocation': t.subject,
          'Assigned Classes': t.assignedClass,
          'Workload (Periods/Day)': t.workload,
          'Contact Phone': t.phone || 'N/A'
        }));
        const ws = XLSX.utils.json_to_sheet(facultyData);
        XLSX.utils.book_append_sheet(wb, ws, 'Faculty_Roster');
        XLSX.writeFile(wb, `ST_VENUS_HIGH_SCHOOL_Faculty_Roster_${Date.now().toString().slice(-4)}.xlsx`);
      } else if (currentTab === 'attendance') {
        // EXPORT DAILY ATTENDANCE REGISTER
        const attData = filtered.map((s, idx) => ({
          'S.No': idx + 1,
          'Student ID': s.id,
          'Roll No': s.rollNo,
          'Student Name': s.name,
          'Class': s.grade,
          'Section': s.section,
          'Today Attendance Status': state.attendanceMap[s.id] || 'Present'
        }));
        const ws = XLSX.utils.json_to_sheet(attData);
        XLSX.utils.book_append_sheet(wb, ws, 'Attendance_Register');
        XLSX.writeFile(wb, `ST_VENUS_HIGH_SCHOOL_Attendance_${Date.now().toString().slice(-4)}.xlsx`);
      } else {
        // EXPORT ALL-IN-ONE MASTER SCHOOL WORKBOOK (MULTIPLE SHEETS)
        const studentData = filtered.map((s, idx) => ({
          'S.No': idx + 1,
          'Student ID': s.id,
          'Roll No': s.rollNo,
          'Student Name': s.name,
          'Gender': s.gender,
          'Date of Birth': s.dob,
          'Class': s.grade,
          'Section': s.section,
          'Parent Name': isAdmin ? s.parentName : 'Hidden',
          'Primary Phone': isAdmin ? s.phone : 'Hidden',
          'Alternate Phone': isAdmin ? (s.altPhone || 'N/A') : 'Hidden',
          'Full Address': s.address
        }));
        const ws1 = XLSX.utils.json_to_sheet(studentData);
        XLSX.utils.book_append_sheet(wb, ws1, 'Student_Directory');

        if (isAdmin) {
          const feeData = filtered.map((s, idx) => {
            const feeCalc = getStudentFeeTotals(s);
            return {
              'S.No': idx + 1, 'Student ID': s.id, 'Student Name': s.name, 'Class': s.grade, 'Section': s.section,
              'Monthly Rate (₹)': feeCalc.monthlyRate,
              '10-Month Tuition Fee (₹)': feeCalc.monthlyRate * 10,
              'Admission Fee (₹)': s.admissionFee || 5000,
              'Exam Fee (₹)': s.examFee || 2000,
              'Grand Total Annual Fee (₹)': feeCalc.grandTotalFee,
              'Paid Months': `${s.paidMonths}/10`,
              'Total Amount Paid (₹)': feeCalc.totalPaidFee,
              'Pending Balance Due (₹)': feeCalc.balanceDue,
              'Payment Status': feeCalc.balanceDue <= 0 ? 'Full Paid' : 'Pending'
            };
          });
          const ws2 = XLSX.utils.json_to_sheet(feeData);
          XLSX.utils.book_append_sheet(wb, ws2, 'Fee_Details_Ledger');
        }

        const facultyData = state.teachers.map((t, idx) => ({
          'S.No': idx + 1, 'Teacher Code': t.teacherCode || t.id, 'Teacher Name': t.name,
          'Qualification': t.qualification, 'Subject Allocation': t.subject,
          'Assigned Classes': t.assignedClass, 'Workload': t.workload
        }));
        const ws3 = XLSX.utils.json_to_sheet(facultyData);
        XLSX.utils.book_append_sheet(wb, ws3, 'Faculty_Roster');

        XLSX.writeFile(wb, `ST_VENUS_HIGH_SCHOOL_Master_Workbook_${Date.now().toString().slice(-4)}.xlsx`);
      }
    }

    // INITIAL RENDER WITH HASH ANCHOR AUTO-DETECTION
    if (window.location.hash && ['#about', '#facilities', '#reviews', '#contact', '#achievements', '#hero'].some(h => window.location.hash.toLowerCase().includes(h))) {
      state.viewMode = 'public';
    }
    render();
  </script>
</body>
</html>
