            const name = isFirstStudent ? 'Munazah Fathima' : `${sampleNames[nameIdx]} (${cls}-${sec})`;

    function saveState() {

      localStorage.setItem('stv_notes_v10', JSON.stringify(state.notes));
      localStorage.setItem('stv_tasks_v10', JSON.stringify(state.tasks));
      render();
    }

    function changeAcademicYear(year) {
      if (state.activeAcademicYear === year) return;
      state.academicHistory[state.activeAcademicYear] = {
        students: JSON.parse(JSON.stringify(state.students)),
        attendanceMap: JSON.parse(JSON.stringify(state.attendanceMap))
      };
      state.activeAcademicYear = year;
      if (state.academicHistory[year]) {
        state.students = JSON.parse(JSON.stringify(state.academicHistory[year].students));
        state.attendanceMap = JSON.parse(JSON.stringify(state.academicHistory[year].attendanceMap));
      }
      saveState();
    }

        return s;
      });

      alert('💾 Additional student notes and instructions saved successfully!');

    function issueTransferCertificate(e, studentId) {
      if (e) e.preventDefault();
      const tcNo = document.getElementById('tcNoInput') ? document.getElementById('tcNoInput').value : `STV-TC-2026-${Date.now().toString().slice(-4)}`;
      const tcDate = document.getElementById('tcIssueDateInput') ? document.getElementById('tcIssueDateInput').value : '2026-08-06';
      const lastWorkDate = document.getElementById('lastWorkDateInput') ? document.getElementById('lastWorkDateInput').value : '2026-08-05';
      const reason = document.getElementById('tcReasonInput') ? document.getElementById('tcReasonInput').value : "Parent's Transfer / School Change";

      state.students = state.students.map(s => {
        if (s.id === studentId) {
          return {
            ...s,
            status: 'Transferred',
            tcNo: tcNo,
            tcIssueDate: tcDate,
            lastWorkingDate: lastWorkDate,
            tcReason: reason,
            remarks: `Transferred / TC Issued on ${tcDate} (${reason})`
          };
        }
        return s;
      });

      if (state.modalStudent && state.modalStudent.id === studentId) {
        state.modalStudent.status = 'Transferred';
        state.modalStudent.tcNo = tcNo;
        state.modalStudent.tcIssueDate = tcDate;
        state.modalStudent.lastWorkingDate = lastWorkDate;
        state.modalStudent.tcReason = reason;
      }

      saveState();
      setTimeout(() => {
        window.print();
      }, 300);
    }

    function executeYearEndPromotion() {
      const currentYear = state.activeAcademicYear;
      const nextYearIndex = state.availableYears.indexOf(currentYear) + 1;
      let nextYear = state.availableYears[nextYearIndex];
      
      if (!nextYear) {
        const parts = currentYear.split('–');
        if (parts.length === 2) {
          const y1 = parseInt(parts[0]) + 1;
          const y2 = parseInt(parts[1]) + 1;
          nextYear = `${y1}–${y2}`;
          state.availableYears.push(nextYear);
        } else {
          nextYear = '2027–2028';
          state.availableYears.push(nextYear);
        }
      }

      state.academicHistory[currentYear] = {
        students: JSON.parse(JSON.stringify(state.students)),
        attendanceMap: JSON.parse(JSON.stringify(state.attendanceMap))
      };
      state.yearStatuses[currentYear] = 'Closed';
      state.yearStatuses[nextYear] = 'Active';

      const promotedStudents = state.students.map(student => {
        const copy = JSON.parse(JSON.stringify(student));
        if (!copy.yearHistory) copy.yearHistory = [];

        // RULE: Do NOT promote students who have been issued TC or marked Transferred!
        if (copy.status === 'Transferred' || copy.status === 'TC Issued') {
          copy.yearHistory.push({
            year: currentYear,
            grade: copy.grade,
            section: copy.section,
            rollNo: copy.rollNo,
            status: 'Transferred'
          });
          copy.status = 'Transferred';
          copy.remarks = `Transferred / TC Issued in ${currentYear} (${copy.tcReason || 'Parent Request'})`;
          return copy;
        }

        copy.yearHistory.push({
          year: currentYear,
          grade: copy.grade,
          section: copy.section,
          rollNo: copy.rollNo,
          status: copy.grade === '10th' ? 'Alumni' : 'Promoted'
        });

        copy.paidMonths = 0;
        copy.paymentHistory = [];

        if (copy.grade === '10th' || copy.status === 'Alumni') {
          copy.status = 'Alumni';
          copy.grade = '10th (Passout)';
          copy.remarks = `Graduated / Alumni - Passed 10th Board Exams in ${currentYear}`;

            '4th': '5th',
            '5th': '6th',
            '6th': '7th',
            '7th': '8th',
            '8th': '9th',
            '9th': '10th'
          };
          copy.grade = nextGradeMap[copy.grade] || copy.grade;
          copy.monthlyFee = getMonthlyFeeByClass(copy.grade);
        }
        return copy;
      });

      const newYearNum = nextYear.split('–')[0] || '2027';
      for (let i = 1; i <= 3; i++) {
        promotedStudents.unshift({

    function calculateGrade(percentage) {
      if (percentage >= 90) return { grade: 'A+', label: 'Outstanding' };
      if (percentage >= 80) return { grade: 'A', label: 'Excellent' };
      if (percentage >= 70) return { grade: 'B', label: 'Good' };
      if (percentage >= 60) return { grade: 'C', label: 'Satisfactory' };
      return { grade: 'F', label: 'Needs Improvement' };
    }

    function calculateTermSummary(student, termName) {
      const marksObj = student.termMarks?.[termName] || {};
      let totalObtained = 0;
      let isPass = true;

      state.subjects.forEach(sub => {
        const val = marksObj[sub] || 0;
        totalObtained += val;
        if (val < 35) isPass = false;
      });

      const maxTotal = state.subjects.length * 100;
      const pct = maxTotal > 0 ? (totalObtained / maxTotal) * 100 : 0;
      const gradeObj = calculateGrade(pct);

      return {
        totalObtained,
        maxTotal,
        pct: pct.toFixed(1),
        grade: gradeObj.grade,
        status: isPass ? 'Pass' : 'Fail',
        marksObj
      };
    }

    function getStudentClassRank(student) {
      if (!student) return { rank: 1, totalInClass: 1 };
      const sameClassStudents = state.students.filter(s => s.grade === student.grade);
      const scoredStudents = sameClassStudents.map(s => {
        const summary = calculateTermSummary(s, 'Final Term Exam');
        return { id: s.id, pct: parseFloat(summary.pct) };
      });
      scoredStudents.sort((a, b) => b.pct - a.pct);
      const rankIndex = scoredStudents.findIndex(s => s.id === student.id);
      return {
        rank: rankIndex >= 0 ? rankIndex + 1 : 1,
        totalInClass: sameClassStudents.length || 1
      };
    }

    function getStudentFeeTotals(student) {
      const monthlyRate = student.monthlyFee || getMonthlyFeeByClass(student.grade);
      const totalMonths = 11; // 11 Monthly Installments (June to April)
      const tuitionTotal = monthlyRate * totalMonths;
      const admissionFee = student.admissionFee || 5000;
      const examFee = student.examFee || 2000;

      // Transportation Details & Bus Fee
      const isBus = student.transportMode === 'School Bus';
      const monthlyBusFee = isBus ? (parseFloat(student.monthlyBusFee) || 1200) : 0;
      const annualBusFee = isBus ? (monthlyBusFee * 10) : 0; // 10 months bus service

      const grandTotalFee = admissionFee + examFee + tuitionTotal + annualBusFee;

      // Calculate Total Paid Amount from payment history array or fallback sample
      let totalPaidFee = 0;
      if (student.paymentHistory && Array.isArray(student.paymentHistory) && student.paymentHistory.length > 0) {
        student.paymentHistory.forEach(p => {
          totalPaidFee += (parseFloat(p.amount) || 0);
        });
      } else {
        const samplePaidMonths = student.paidMonths !== undefined ? student.paidMonths : 3;
        totalPaidFee = ((monthlyRate + monthlyBusFee) * samplePaidMonths) + admissionFee + examFee;
      }

      const balanceDue = Math.max(0, grandTotalFee - totalPaidFee);
      const totalMonthlyPackage = monthlyRate + monthlyBusFee;

      // Calculate paid months count
      const actualTuitionPaid = Math.max(0, totalPaidFee - admissionFee - examFee);
      const paidMonthsCount = Math.min(totalMonths, parseFloat((actualTuitionPaid / (totalMonthlyPackage || 1)).toFixed(1)));

      // Current academic month index (August = 3rd month)
      const currentMonthIndex = 3;
      const expectedTuitionDue = currentMonthIndex * totalMonthlyPackage;
      const arrears = Math.max(0, expectedTuitionDue - actualTuitionPaid);

      return {
        monthlyRate,
        totalMonths,
        tuitionTotal,
        admissionFee,
        examFee,
        isBus,
        monthlyBusFee,
        annualBusFee,
        grandTotalFee,
        totalPaidFee,
        balanceDue,
        paidMonthsCount,
        pendingInstallments: Math.max(0, parseFloat((totalMonths - paidMonthsCount).toFixed(1))),
        currentMonthIndex,
        expectedTuitionDue,
        actualTuitionPaid,
        arrears
      };
    }

    function handleFileUpload(event, moduleKey) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rawRows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          
          if (!rawRows || rawRows.length === 0) {
            alert('⚠️ The uploaded file is empty or could not be parsed.');
            return;
          }

          validateModuleImport(moduleKey, rawRows);
        } catch (err) {
          alert('❌ Failed to parse Excel/CSV file: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

    function validateModuleImport(moduleKey, rawRows) {
      const parsedRows = [];
      let validCount = 0, invalidCount = 0, duplicateCount = 0;
      const seenKeys = new Set();

      rawRows.forEach((row, idx) => {
        const rowNum = idx + 2;
        const errors = [];
        let isDuplicate = false;

        if (moduleKey === 'students') {
          const name = row['StudentName'] || row['name'] || row['Student Name'] || '';
          const cls = row['Class'] || row['grade'] || row['Grade'] || '';
          const rollNo = (row['RollNo'] || row['rollNo'] || row['Roll No'] || '').toString();

          if (!name) errors.push('Student Name is required');
          if (!cls) errors.push('Class is required');
          if (!rollNo) errors.push('Roll No is required');

          const dupKey = `${cls.toLowerCase()}-${rollNo}`;
          if (seenKeys.has(dupKey) || state.students.some(s => s.grade.toLowerCase() === cls.toLowerCase() && s.rollNo.toString() === rollNo)) {
            isDuplicate = true;
            errors.push(`Duplicate record for Class ${cls} Roll #${rollNo}`);
          } else {
            seenKeys.add(dupKey);
          }
        } else if (moduleKey === 'marks') {
          const studentId = row['StudentID'] || row['studentId'] || row['Student ID'] || '';
          if (!studentId) errors.push('Student ID is required');

          ['Telugu', 'Hindi', 'English', 'Maths', 'Science', 'Social'].forEach(sub => {
            if (row[sub] !== undefined && row[sub] !== '') {
              const val = parseFloat(row[sub]);
              if (isNaN(val) || val < 0 || val > 100) {
                errors.push(`${sub} mark must be a valid number between 0 and 100`);
              }
            }
          });
        } else if (moduleKey === 'fees') {
          const studentId = row['StudentID'] || row['studentId'] || '';
          if (!studentId) errors.push('Student ID is required');
          const paidMonths = parseFloat(row['PaidMonthsCount'] || row['paidMonths'] || 0);
          if (isNaN(paidMonths) || paidMonths < 0 || paidMonths > 11) {
            errors.push('Paid Months Count must be a number between 0 and 11');
          }
        } else if (moduleKey === 'attendance') {
          const studentId = row['StudentID'] || row['studentId'] || '';
          const status = (row['Status'] || 'Present').trim();
          if (!studentId) errors.push('Student ID is required');
          if (!['Present', 'Absent', 'Holiday', 'Sunday'].includes(status)) {
            errors.push('Status must be Present, Absent, Holiday, or Sunday');
          }
        } else if (moduleKey === 'faculty') {
          const teacherName = row['TeacherName'] || row['name'] || '';
          const subject = row['MainSubject'] || row['subject'] || '';
          if (!teacherName) errors.push('Teacher Name is required');
          if (!subject) errors.push('Main Subject is required');
        }

        const isValid = errors.length === 0;
        if (isValid) validCount++;
        else invalidCount++;
        if (isDuplicate) duplicateCount++;

        parsedRows.push({
          rowNum,
          rowData: row,
          isValid,
          isDuplicate,
          errors
        });
      });

      state.importPreview = {
        moduleKey,
        totalRows: rawRows.length,
        validCount,
        invalidCount,
        duplicateCount,
        rows: parsedRows
      };

      state.activeModal = 'importPreview';
      render();
    }

            const date = row['AttendanceDate'] || '2026-08-05';

            state.attendanceMap[student.id] = status;
            if (!student.attendanceHistory) student.attendanceHistory = {};
            student.attendanceHistory[date] = {
              status: status,
              reason: row['AbsenceReason'] || '',
              leaveApproved: true
            };
            importedCount++;
          }
        } else if (moduleKey === 'faculty') {
          const tName = row['TeacherName'] || row['name'] || 'Faculty Teacher';
          state.teachers.push({
            id: state.teachers.length + 1,
            name: tName,
            subject: row['MainSubject'] || 'General Science',
            qualification: row['Qualification'] || 'B.Ed',
            phone: (row['Phone'] || '9849011223').toString(),
            email: row['Email'] || 'teacher@stvenus.edu',
            classes: row['AssignedClasses'] ? row['AssignedClasses'].toString().split(',').map(c => c.trim()) : ['5th', '6th'],
            salary: parseFloat(row['MonthlySalary']) || 30000
          });
          importedCount++;
        }
      });

      saveState();

      const failedRows = rows.filter(r => !r.isValid);
      state.importResultSummary = {
        moduleKey,
        total: rows.length,
        importedCount,
        failedCount: failedRows.length,
        failedRows
      };

      state.activeModal = 'importSummary';
      render();
    }

    function downloadErrorReport() {
      if (!state.importResultSummary || !state.importResultSummary.failedRows) return;
      const failedRows = state.importResultSummary.failedRows;
      
      const exportData = failedRows.map(r => ({
        ExcelRowNumber: r.rowNum,
        ...r.rowData,
        ValidationErrors: r.errors.join(' | ')
      }));

      if (typeof XLSX !== 'undefined') {
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Validation_Errors");
        XLSX.writeFile(wb, `Import_Error_Report_${Date.now()}.xlsx`);
      }
    }

    function getStudentAttendanceStats(student, yearConfig = ACADEMIC_YEAR_CONFIG) {
      if (!student) return { academicYear: '2026–2027', totalWorkingDays: 0, totalPresent: 0, totalAbsent: 0, attendancePct: '100.0', totalRemainingDays: 0, totalHolidays: 0, totalSundays: 0 };
      
      const history = student.attendanceHistory || {};
      const start = new Date(yearConfig.startDate);
      const end = new Date(yearConfig.endDate);
      const today = new Date('2026-08-03');

      let totalWorkingDays = 0;
      let totalPresent = 0;
      let totalAbsent = 0;
      let totalHolidays = 0;
      let totalSundays = 0;
      let totalRemainingDays = 0;

      const holidayDateSet = new Set(yearConfig.holidays.map(h => h.date));

      let curr = new Date(start);
      while (curr <= end) {
        const isoDate = curr.toISOString().split('T')[0];
        const isSunday = curr.getDay() === 0;
        const isHoliday = holidayDateSet.has(isoDate);

        if (curr <= today) {
          if (isSunday) {
            totalSundays++;
          } else if (isHoliday) {
            totalHolidays++;
          } else {
            totalWorkingDays++;
            const record = history[isoDate];
            if (record && record.status === 'Absent') {
              totalAbsent++;
            } else {
              totalPresent++;
            }
          }
        } else {
          if (!isSunday && !isHoliday) {
            totalRemainingDays++;
          }
        }
        curr.setDate(curr.getDate() + 1);
      }

      const attendancePct = totalWorkingDays > 0 ? ((totalPresent / totalWorkingDays) * 100).toFixed(1) : '100.0';

      return {
        academicYear: yearConfig.yearName,
        startDate: yearConfig.startDate,
        endDate: yearConfig.endDate,
        todayDate: '2026-08-03',
        totalWorkingDays,
        totalPresent,
        totalAbsent,
        attendancePct,
        totalRemainingDays,
        totalHolidays,
        totalSundays
      };
    }

    function getAbsenceRecordsForStudent(student, yearConfig = ACADEMIC_YEAR_CONFIG) {
      if (!student) return [];
      const history = student.attendanceHistory || {};
      const holidayDateSet = new Set(yearConfig.holidays.map(h => h.date));
      const todayIso = '2026-08-03';
      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const records = [];

      // Check all dates up to today
      const start = new Date(yearConfig.startDate);
      const today = new Date(todayIso);

      let curr = new Date(start);
      while (curr <= today) {
        const isoDate = curr.toISOString().split('T')[0];
        const isSunday = curr.getDay() === 0;
        const isHoliday = holidayDateSet.has(isoDate);

        if (!isSunday && !isHoliday) {
          const rec = history[isoDate];
          if (rec && rec.status === 'Absent') {
            const dObj = new Date(curr);
            records.push({
              isoDate,
              formattedDate: `${dObj.getDate() < 10 ? '0' + dObj.getDate() : dObj.getDate()}-${monthNames[dObj.getMonth()].slice(0, 3)}-${dObj.getFullYear()}`,
              dayName: dayNames[dObj.getDay()],
              monthName: `${monthNames[dObj.getMonth()]} ${dObj.getFullYear()}`,
              reason: rec.reason || 'Fever / Sick Leave',
              leaveApproved: rec.leaveApproved !== undefined ? rec.leaveApproved : true
            });
          }
        }
        curr.setDate(curr.getDate() + 1);
      }

      // Default sample if empty for demonstration
      if (records.length === 0 && student) {
        records.push(
          { isoDate: '2026-07-15', formattedDate: '15-Jul-2026', dayName: 'Wednesday', monthName: 'July 2026', reason: 'Fever / Sick Leave', leaveApproved: true },
          { isoDate: '2026-07-28', formattedDate: '28-Jul-2026', dayName: 'Tuesday', monthName: 'July 2026', reason: 'Family Function', leaveApproved: false }
        );
      }

      return records;
    }

    function renderMonthlyCalendar(student, year, monthIndex) {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const monthName = monthNames[monthIndex];
      const firstDay = new Date(year, monthIndex, 1);
      const startingDayOfWeek = firstDay.getDay();
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

      const history = student ? (student.attendanceHistory || {}) : {};
      const holidayDateSet = new Set(ACADEMIC_YEAR_CONFIG.holidays.map(h => h.date));
      const todayIso = '2026-08-03';

      let cellsHtml = '';

      for (let i = 0; i < startingDayOfWeek; i++) {
        cellsHtml += `<div class="h-14 bg-slate-50/50 border border-slate-200/60 rounded-xl"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dayStr = d < 10 ? `0${d}` : `${d}`;
        const mStr = (monthIndex + 1) < 10 ? `0${monthIndex + 1}` : `${monthIndex + 1}`;
        const isoDate = `${year}-${mStr}-${dayStr}`;
        
        const dateObj = new Date(year, monthIndex, d);
        const isSunday = dateObj.getDay() === 0;
        const isHoliday = holidayDateSet.has(isoDate);
        const holidayObj = ACADEMIC_YEAR_CONFIG.holidays.find(h => h.date === isoDate);

        const record = history[isoDate];
        const isPastOrToday = isoDate <= todayIso;

        let cellClass = 'bg-white text-slate-800 border-slate-200 hover:border-indigo-400';
        let badgeText = '';

        if (isSunday) {
          cellClass = 'bg-slate-300 text-slate-700 font-bold border-slate-400';
          badgeText = 'Sunday';
        } else if (isHoliday) {
          cellClass = 'bg-amber-400 text-slate-900 font-bold border-amber-500';
          badgeText = holidayObj ? holidayObj.name : 'Holiday';
        } else if (isPastOrToday) {
          if (record && record.status === 'Absent') {
            cellClass = 'bg-rose-600 text-white font-bold border-rose-700 shadow-xs';
            badgeText = '🔴 Absent';
          } else {
            cellClass = 'bg-emerald-500 text-white font-bold border-emerald-600 shadow-xs';
            badgeText = '🟢 Present';
          }
        } else {
          cellClass = 'bg-slate-50 text-slate-400 border-slate-200';
          badgeText = 'School Day';
        }

        cellsHtml += `
          <div onclick="openDateAttendanceModal('${student.id}', '${isoDate}')" class="h-14 p-1.5 border rounded-xl flex flex-col justify-between cursor-pointer transition-all hover:scale-105 ${cellClass}">
            <div class="flex justify-between items-center text-xs font-black">
              <span>${d}</span>
              ${isoDate === todayIso ? '<span class="bg-white text-slate-900 text-[9px] px-1 rounded font-bold">TODAY</span>' : ''}
            </div>
            <div class="text-[9px] font-bold truncate">${badgeText}</div>
          </div>
        `;
      }

      return `
        <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 shadow-sm">
          <div class="flex flex-wrap justify-between items-center border-b pb-3 gap-2">
            <h4 class="text-lg font-black text-slate-900 font-display">Monthly Attendance Calendar: ${monthName} ${year}</h4>

              <span class="flex items-center space-x-1.5"><span class="w-3.5 h-3.5 rounded bg-emerald-500 inline-block shadow-2xs"></span> <span>🟢 Present (Green)</span></span>
              <span class="flex items-center space-x-1.5"><span class="w-3.5 h-3.5 rounded bg-rose-600 inline-block shadow-2xs"></span> <span>🔴 Absent (Red)</span></span>

    function renderDigitGrid(valueStr = '', totalDigits = 12) {
      const digits = (valueStr || '').replace(/\D/g, '').split('');
      let html = '<div class="inline-flex items-center space-x-1.5 font-mono font-bold text-xs">';
      
      if (totalDigits === 12) {
        for (let group = 0; group < 3; group++) {
          html += '<div class="flex border border-slate-700 bg-white rounded overflow-hidden shadow-2xs">';
          for (let i = 0; i < 4; i++) {
            const idx = group * 4 + i;
            const d = digits[idx] || '';
            html += `<span class="w-4 h-5 flex items-center justify-center border-r border-slate-300 last:border-r-0 text-slate-900 font-bold text-[11px]">${d}</span>`;
          }
          html += '</div>';
        }
      } else if (totalDigits === 10) {
        html += '<div class="flex border border-slate-700 bg-white rounded overflow-hidden shadow-2xs">';
        for (let i = 0; i < 10; i++) {
          const d = digits[i] || '';
          html += `<span class="w-4 h-5 flex items-center justify-center border-r border-slate-300 last:border-r-0 text-slate-900 font-bold text-[10px]">${d}</span>`;
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

        let matchStatus = true;
        const isTransferred = (s.status === 'Transferred' || s.status === 'TC Issued');
        const isAlumni = (s.status === 'Alumni' || s.grade.includes('10th (Passout)'));

        if (state.selectedStatusFilter === 'active') {

        } else if (state.selectedStatusFilter === 'transferred') {

        } else if (state.selectedStatusFilter === 'alumni') {

        }

        const search = state.searchTerm.toLowerCase().trim();
        const matchSearch = !search ||

          s.parentName.toLowerCase().includes(search) ||
          s.phone.includes(search) ||
          s.grade.toLowerCase().includes(search);

        return matchGrade && matchSec && matchStatus && matchSearch;
      });

    function saveFeePayment(e) {
      e.preventDefault();
      if (!state.modalStudent) return;
      const month = document.getElementById('feeMonthInput').value;
      const mode = document.getElementById('feeModeInput').value;
      const amount = parseFloat(document.getElementById('feeAmountInput').value) || getMonthlyFeeByClass(state.modalStudent.grade);
      const receiptNo = `REC-STV-${Date.now().toString().slice(-5)}`;
      const todayDate = new Date().toISOString().split('T')[0];

      let updatedTargetStudent = null;

      state.students = state.students.map(s => {
        if (s.id === state.modalStudent.id) {
          const currentHistory = s.paymentHistory || [];
          const newTx = { receiptNo, date: todayDate, month, amount, mode };
          const updatedHistory = [newTx, ...currentHistory];

          // Compute new totals after payment
          let newTotalPaid = 0;
          updatedHistory.forEach(p => { newTotalPaid += (parseFloat(p.amount) || 0); });

          const monthlyRate = s.monthlyFee || getMonthlyFeeByClass(s.grade);
          const admissionFee = s.admissionFee || 5000;
          const examFee = s.examFee || 2000;
          const actualTuitionPaid = Math.max(0, newTotalPaid - admissionFee - examFee);
          const newPaidMonths = Math.min(11, parseFloat((actualTuitionPaid / monthlyRate).toFixed(1)));

          updatedTargetStudent = {
            ...s,
            paidMonths: newPaidMonths,
            paymentHistory: updatedHistory
          };
          return updatedTargetStudent;
        }
        return s;
      });

      if (updatedTargetStudent) {
        state.modalStudent = updatedTargetStudent;
        state.modalTransaction = updatedTargetStudent.paymentHistory[0];
        state.activeModal = 'printFeeReceipt';
        saveState();
        setTimeout(() => {
          window.print();
        }, 300);
      } else {
        closeModal();
      }
    }

    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        state.tempPhotoPreview = evt.target.result;
        saveState();
      };
      reader.readAsDataURL(file);
    }

    function saveNewStudent(e) {
      e.preventDefault();
      const grade = document.getElementById('newGrade').value;
      const customSec = document.getElementById('newSection') ? document.getElementById('newSection').value : 'B';
      const classSecList = state.students.filter(s => s.grade === grade && s.section === customSec);
      const roll = (classSecList.length + 1).toString();

      const term1Marks = { Telugu: 80, Hindi: 78, English: 85, Maths: 82, Science: 80, Social: 81 };
      const term2Marks = { Telugu: 84, Hindi: 82, English: 88, Maths: 86, Science: 84, Social: 85 };
      const term3Marks = { Telugu: 88, Hindi: 86, English: 92, Maths: 90, Science: 88, Social: 89 };

      const fatherNameVal = document.getElementById('newFatherName') ? document.getElementById('newFatherName').value : 'Father Name';
      const studentNameVal = document.getElementById('newName').value.toUpperCase();

      const newStudent = {
        id: `STD-${Date.now().toString().slice(-4)}`,
        rollNo: roll,
        admnNo: document.getElementById('newAdmnNo') ? document.getElementById('newAdmnNo').value : `STV-2026-${Date.now().toString().slice(-4)}`,
        name: studentNameVal,
        gender: document.getElementById('newGender').value,
        dob: document.getElementById('newDob').value || '2019-08-02',
        grade: grade,
        section: customSec,
        studentAadhaar: document.getElementById('newStudentAadhaar') ? document.getElementById('newStudentAadhaar').value : '3645 8912 4401',
        
        parentName: `${fatherNameVal} (Father of ${studentNameVal})`,
        parentRelation: 'Father',
        phone: document.getElementById('newPhone').value,
        whatsappNo: document.getElementById('newWhatsappNo') ? document.getElementById('newWhatsappNo').value : document.getElementById('newPhone').value,
        altPhone: document.getElementById('newWhatsappNo') ? document.getElementById('newWhatsappNo').value : document.getElementById('newPhone').value,
        address: document.getElementById('newAddress').value,
        photoUrl: state.tempPhotoPreview || DEFAULT_AVATAR,
        
        motherName: document.getElementById('newMotherName') ? document.getElementById('newMotherName').value : 'Fatima Begum',
        motherProfession: document.getElementById('newMotherProf') ? document.getElementById('newMotherProf').value : 'Homemaker',
        motherAadhaar: document.getElementById('newMotherAadhaar') ? document.getElementById('newMotherAadhaar').value : '8821 4451 9012',
        motherOfficeAddress: document.getElementById('newMotherOffAddr') ? document.getElementById('newMotherOffAddr').value : 'Chilkanagar, Uppal',
        
        fatherName: fatherNameVal,
        fatherProfession: document.getElementById('newFatherProf') ? document.getElementById('newFatherProf').value : 'Business',
        fatherAadhaar: document.getElementById('newFatherAadhaar') ? document.getElementById('newFatherAadhaar').value : '4410 7782 1198',
        fatherOfficeAddress: document.getElementById('newFatherOffAddr') ? document.getElementById('newFatherOffAddr').value : 'Main Road, Uppal',
        
        identMark1: document.getElementById('newIdentMark1') ? document.getElementById('newIdentMark1').value : 'A mole on the right cheek',
        identMark2: document.getElementById('newIdentMark2') ? document.getElementById('newIdentMark2').value : 'A scar on the left wrist',
        
        sibling1Name: document.getElementById('newSib1Name') ? document.getElementById('newSib1Name').value : '',
        sibling1Class: document.getElementById('newSib1Class') ? document.getElementById('newSib1Class').value : '',
        sibling1Sec: document.getElementById('newSib1Sec') ? document.getElementById('newSib1Sec').value : '',
        sibling2Name: document.getElementById('newSib2Name') ? document.getElementById('newSib2Name').value : '',
        sibling2Class: document.getElementById('newSib2Class') ? document.getElementById('newSib2Class').value : '',
        sibling2Sec: document.getElementById('newSib2Sec') ? document.getElementById('newSib2Sec').value : '',

        transportMode: document.getElementById('newTransportMode') ? document.getElementById('newTransportMode').value : 'Own Transportation',
        busRoute: document.getElementById('newBusRoute') ? document.getElementById('newBusRoute').value.split('|')[0] : 'Route 2 - Uppal Depot / Junction',
        pickupPoint: document.getElementById('newPickupPoint') ? document.getElementById('newPickupPoint').value : 'Uppal X Roads',
        monthlyBusFee: document.getElementById('newTransportMode') && document.getElementById('newTransportMode').value === 'School Bus' ? (parseFloat(document.getElementById('newMonthlyBusFee').value) || 1200) : 0,

        admissionFee: 5000,
        examFee: 2000,
        monthlyFee: getMonthlyFeeByClass(grade),
        totalMonths: 10,
        paidMonths: 3,
        admissionFeePaid: true,
        examFeePaid: true,
        termMarks: {
          '1st Term Exam': term1Marks,
          '2nd Term Exam': term2Marks,
          'Final Term Exam': term3Marks
        },
        paymentHistory: []
      };

      state.students.unshift(newStudent);
      state.activeModal = 'printAdmission';
      state.modalStudent = newStudent;
      saveState();
    }

    function addSubject(e) {
      e.preventDefault();
      const val = document.getElementById('newSubjInput').value.trim();
      if (val && !state.subjects.includes(val)) {
        state.subjects.push(val);
      }
      saveState();
    }

    function removeSubject(sub) {
      if (confirm(`Remove subject ${sub}?`)) {
        state.subjects = state.subjects.filter(s => s !== sub);
        saveState();
      }
    }

    function setAttendance(id, st) {
      state.attendanceMap[id] = st;
      saveState();
    }

    function addTask(e) {
      e.preventDefault();
      const val = document.getElementById('newTaskInput').value.trim();
      if (val) { state.tasks.unshift({ id: Date.now(), title: val, completed: false }); }
      saveState();
    }

    function toggleTask(id) {
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveState();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
    }

    function addNote(e) {
      e.preventDefault();
      const val = document.getElementById('newNoteInput').value.trim();
      if (val) { state.notes.unshift({ id: Date.now(), text: val, date: '02-Aug-2026' }); }
      saveState();
    }

    function deleteNote(id) {
      state.notes = state.notes.filter(n => n.id !== id);
      saveState();
    }

    function exportToExcel() {
      const currentTab = state.activeTab;
      const filtered = getFilteredStudents();
      const isAdmin = state.currentUser?.role === 'admin';
      const wb = XLSX.utils.book_new();

      if (currentTab === 'fees' && isAdmin) {
        // EXPORT COMPLETE FEE DETAILS LEDGER
        const feeData = filtered.map((s, idx) => {
          const feeCalc = getStudentFeeTotals(s);
          return {
            'S.No': idx + 1,
            'Student ID': s.id,
            'Roll No': s.rollNo,
            'Student Name': s.name,
            'Class': s.grade,
            'Section': s.section,
            'Parent Name': s.parentName,
            'Primary Phone': s.phone,
            'Alternate Phone': s.altPhone || 'N/A',
            'Monthly Fee Rate (₹)': feeCalc.monthlyRate,
            '10-Month Tuition Fee (₹)': feeCalc.monthlyRate * 10,
            'Admission Fee (₹)': s.admissionFee || 5000,
            'Exam Fee (₹)': s.examFee || 2000,
            'Grand Total Annual Fee (₹)': feeCalc.grandTotalFee,
            'Paid Months (out of 10)': `${s.paidMonths}/10`,
            'Total Amount Paid (₹)': feeCalc.totalPaidFee,
            'Pending Balance Due (₹)': feeCalc.balanceDue,
            'Fee Status': feeCalc.balanceDue <= 0 ? 'Full Paid' : (feeCalc.totalPaidFee > 0 ? 'Partial Paid' : 'Unpaid')
          };
        });
        const ws = XLSX.utils.json_to_sheet(feeData);
        XLSX.utils.book_append_sheet(wb, ws, 'Fee_Details_Ledger');
        XLSX.writeFile(wb, `ABC_TESTING_School_Fee_Details_${Date.now().toString().slice(-4)}.xlsx`);
      } else if (currentTab === 'performance') {
        // EXPORT COMPLETE ACADEMIC MARKS & MULTI-TERM PERFORMANCE
        const marksData = filtered.map((s, idx) => {
          const s1 = calculateTermSummary(s, '1st Term Exam');
          const s2 = calculateTermSummary(s, '2nd Term Exam');
          const s3 = calculateTermSummary(s, 'Final Term Exam');
          const rankInfo = getStudentClassRank(s);

          const row = {
            'S.No': idx + 1,
            'Student ID': s.id,
            'Roll No': s.rollNo,
            'Student Name': s.name,
            'Class': s.grade,
            'Section': s.section,
            'Class Rank': `#${rankInfo.rank} of ${rankInfo.totalInClass}`,
            '1st Term Score': `${s1.totalObtained}/${s1.maxTotal}`,
            '1st Term Pct': `${s1.pct}%`,
            '1st Term Grade': s1.grade,
            '1st Term Status': s1.status,
            '2nd Term Score': `${s2.totalObtained}/${s2.maxTotal}`,
            '2nd Term Pct': `${s2.pct}%`,
            '2nd Term Grade': s2.grade,
            '2nd Term Status': s2.status,
            'Final Term Score': `${s3.totalObtained}/${s3.maxTotal}`,
            'Final Term Pct': `${s3.pct}%`,
            'Final Term Grade': s3.grade,
            'Final Term Status': s3.status
          };

          state.subjects.forEach(sub => {
            row[`Final Marks (${sub})`] = s.termMarks?.['Final Term Exam']?.[sub] ?? 0;
          });

          return row;
        });
        const ws = XLSX.utils.json_to_sheet(marksData);
        XLSX.utils.book_append_sheet(wb, ws, 'Academic_Performance');
        XLSX.writeFile(wb, `ABC_TESTING_School_Academic_Marks_${Date.now().toString().slice(-4)}.xlsx`);
      } else if (currentTab === 'faculty') {
        // EXPORT COMPLETE FACULTY ROSTER & WORKLOADS
        const facultyData = state.teachers.map((t, idx) => ({
          'S.No': idx + 1,
          'Teacher Code': t.teacherCode || t.id,
          'Teacher Name': t.name,
          'Qualification': t.qualification,
          'Subject Allocation': t.subject,
          'Assigned Classes': t.assignedClass,
          'Workload (Periods/Day)': t.workload,
          'Contact Phone': t.phone || 'N/A'
        }));
        const ws = XLSX.utils.json_to_sheet(facultyData);
        XLSX.utils.book_append_sheet(wb, ws, 'Faculty_Roster');
        XLSX.writeFile(wb, `ABC_TESTING_School_Faculty_Roster_${Date.now().toString().slice(-4)}.xlsx`);
      } else if (currentTab === 'attendance') {
        // EXPORT DAILY ATTENDANCE REGISTER
        const attData = filtered.map((s, idx) => ({
          'S.No': idx + 1,
          'Student ID': s.id,
          'Roll No': s.rollNo,
          'Student Name': s.name,
          'Class': s.grade,
          'Section': s.section,
          'Today Attendance Status': state.attendanceMap[s.id] || 'Present'
        }));
        const ws = XLSX.utils.json_to_sheet(attData);
        XLSX.utils.book_append_sheet(wb, ws, 'Attendance_Register');
        XLSX.writeFile(wb, `ABC_TESTING_School_Attendance_${Date.now().toString().slice(-4)}.xlsx`);
      } else {
        // EXPORT ALL-IN-ONE MASTER SCHOOL WORKBOOK (MULTIPLE SHEETS)
        const studentData = filtered.map((s, idx) => ({
          'S.No': idx + 1,
          'Student ID': s.id,
          'Roll No': s.rollNo,
          'Student Name': s.name,
          'Gender': s.gender,
          'Date of Birth': s.dob,
          'Class': s.grade,
          'Section': s.section,
          'Parent Name': isAdmin ? s.parentName : 'Hidden',
          'Primary Phone': isAdmin ? s.phone : 'Hidden',
          'Alternate Phone': isAdmin ? (s.altPhone || 'N/A') : 'Hidden',
          'Full Address': s.address
        }));
        const ws1 = XLSX.utils.json_to_sheet(studentData);
        XLSX.utils.book_append_sheet(wb, ws1, 'Student_Directory');

        if (isAdmin) {
          const feeData = filtered.map((s, idx) => {
            const feeCalc = getStudentFeeTotals(s);
            return {
              'S.No': idx + 1, 'Student ID': s.id, 'Student Name': s.name, 'Class': s.grade, 'Section': s.section,
              'Monthly Rate (₹)': feeCalc.monthlyRate,
              '10-Month Tuition Fee (₹)': feeCalc.monthlyRate * 10,
              'Admission Fee (₹)': s.admissionFee || 5000,
              'Exam Fee (₹)': s.examFee || 2000,
              'Grand Total Annual Fee (₹)': feeCalc.grandTotalFee,
              'Paid Months': `${s.paidMonths}/10`,
              'Total Amount Paid (₹)': feeCalc.totalPaidFee,
              'Pending Balance Due (₹)': feeCalc.balanceDue,
              'Payment Status': feeCalc.balanceDue <= 0 ? 'Full Paid' : 'Pending'
            };
          });
          const ws2 = XLSX.utils.json_to_sheet(feeData);
          XLSX.utils.book_append_sheet(wb, ws2, 'Fee_Details_Ledger');
        }

        const facultyData = state.teachers.map((t, idx) => ({
          'S.No': idx + 1, 'Teacher Code': t.teacherCode || t.id, 'Teacher Name': t.name,
          'Qualification': t.qualification, 'Subject Allocation': t.subject,
          'Assigned Classes': t.assignedClass, 'Workload': t.workload
        }));
        const ws3 = XLSX.utils.json_to_sheet(facultyData);
        XLSX.utils.book_append_sheet(wb, ws3, 'Faculty_Roster');

        XLSX.writeFile(wb, `ABC_TESTING_School_Master_Workbook_${Date.now().toString().slice(-4)}.xlsx`);
      }
    }

    // INITIAL RENDER
    render();
  </script>
</body>
</html>
